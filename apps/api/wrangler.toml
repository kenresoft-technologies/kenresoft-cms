# Kenresoft CMS — API Worker

name = "kenresoft-cms-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
# better-auth needs node:async_hooks (AsyncLocalStorage) at runtime.
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "kenresoft-cms-db"
database_id = "29f46754-9256-4c0f-a2fc-90df8365d9aa"
migrations_dir = "../../packages/database/migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "kenresoft-cms-media"

# No KV namespace here — Workers KV as a secondary caching tier is documented
# (docs/ARCHITECTURE.md §12) but not implemented; nothing in src/ reads or writes it yet, so
# provisioning one would just be an unused resource. Add it back when that's actually built.

[[ratelimits]]
# Public form submissions (§9) — 5 per 60s per rate-limit key (IP address). namespace_id is
# an arbitrary account-unique identifier, not a provisioned resource — no setup step needed.
name = "FORM_SUBMISSION_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
# better-auth's own routes (/api/v1/auth/*) had no rate limiting at all — sign-in/sign-up were
# brute-forceable at whatever throughput a client could sustain. 10 per 60s per IP, applied
# only to POST (sign-in/sign-up/sign-out/etc.), not GET (get-session — the SPA calls that on
# every load/navigation, so limiting it would cause real false-positive lockouts).
name = "AUTH_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
# Password-reset request/confirm, recovery-code redemption, and the break-glass owner-recovery
# endpoint (docs/ARCHITECTURE.md's recovery section) — all either send email or attempt a
# credential-like guess, so all share one conservative per-IP limit. Tighter than the others
# since a successful hit here changes someone's password.
name = "RECOVERY_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 3, period = 60 }

[triggers]
# Scheduled publishing (§13) — checks for draft entries whose publishAt has elapsed.
crons = ["*/5 * * * *"]

[vars]
API_VERSION = "v1"
# Comma-separated allow-list per docs/ARCHITECTURE.md §9 — never "*". These are this Worker's
# real deployed values; apps/api/.dev.vars overrides both back to localhost for local dev (see
# .dev.vars.example) since .dev.vars overrides plain vars too, not just secrets.
#
# CORS only matters for browser-originated requests — apps/admin is the only one today (the
# Astro integration fetches server-side, no Origin header involved). apps/admin has no deployed
# home yet (deliberately deferred), so the only real admin origin right now is the local Vite
# dev server — but Vite auto-increments past 5173 whenever that port's already taken (a normal,
# frequent occurrence with several dev servers running at once), so a handful of adjacent ports
# are allow-listed rather than just one. Add the admin's real deployed origin here once it has
# one, and drop these once dev:live typically lands on a stable port.
#
# The 192.168.0.159 entries are a personal convenience, not a general solution: `dev:live`
# runs with --host, so it's reachable from other devices on the same LAN (a phone, for
# instance) via the host machine's LAN IP — but that's a different browser origin than
# "localhost", so it needs its own allow-list entries. This IP is DHCP-assigned and will go
# stale whenever it changes; update it (or drop it if no longer needed) rather than leaving a
# dead entry here.
CORS_ORIGINS = "http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://192.168.0.159:5173,http://192.168.0.159:5174,http://192.168.0.159:5175,http://192.168.0.159:5176,http://192.168.0.159:5177"
BETTER_AUTH_URL = "https://kenresoft-cms-api.kenresoft.workers.dev"
# BETTER_AUTH_SECRET is a real secret, not a var — set it in apps/api/.dev.vars for local dev
# (see .dev.vars.example) and via `wrangler secret put BETTER_AUTH_SECRET` for deployed envs.

# Password-recovery email (docs/ARCHITECTURE.md's recovery section) — all optional. Unset
# EMAIL_PROVIDER (the default) uses a noop sender that logs instead of sending, so this Worker
# runs with zero email setup. Set these to actually deliver password-reset emails:
#   EMAIL_PROVIDER = "cloudflare"   # or "resend"
#   EMAIL_FROM = "noreply@yourdomain.example"
#   ADMIN_URL = "https://your-admin.example"        # where the reset-password link points
# "cloudflare" also needs a [[send_email]] binding here plus `wrangler email sending enable`
# for EMAIL_FROM's domain; "resend" needs RESEND_API_KEY as a secret
# (`wrangler secret put RESEND_API_KEY`) and a domain verified in the Resend dashboard.

# The break-glass owner-recovery endpoint (POST /api/v1/system/recover-owner) is disabled
# (404) unless this secret is set — deliberately absent here and with no default anywhere in
# the code. An operator who wants it enables it explicitly:
#   wrangler secret put OWNER_RECOVERY_SECRET
