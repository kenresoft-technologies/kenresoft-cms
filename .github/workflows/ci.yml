name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Read-only by default (this job never needs to write to the repo, issues, or PRs) — least
# privilege for the GITHUB_TOKEN every step in this workflow implicitly receives.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # apps/admin's build bakes VITE_API_URL into the bundle and the generated Workers
          # Static Assets _headers file (see apps/admin/scripts/generate-headers.mjs) — required
          # for a real deploy, but this job only validates that the monorepo compiles, so a
          # placeholder is enough. Never used to serve real traffic.
          VITE_API_URL: https://example.workers.dev
