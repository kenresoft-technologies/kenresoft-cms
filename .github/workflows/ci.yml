name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Read-only by default (this job never needs to write to the repo, issues, or PRs) — least
# privilege for the GITHUB_TOKEN every step in this workflow implicitly receives.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        # The CMS's own test suite is for the source repository. A deployment that inherited this
        # workflow already gets these tests' coverage upstream, and its private-repo runners (2 vCPU
        # vs 4 for public repos) are too small for the API's workerd suite, so it skips them by
        # default. Set the repository variable RUN_FULL_TESTS=true to run them anyway.
        if: github.event.repository.private == false || vars.RUN_FULL_TESTS == 'true'
        # One package at a time: apps/admin's jsdom suite running alongside apps/api's workerd
        # suite can starve the API tests into timeouts on small runners.
        run: pnpm -r --workspace-concurrency=1 test && pnpm run test:scripts

      - name: Build
        run: pnpm build
        env:
          # apps/admin's build bakes VITE_API_URL into the bundle and the generated Workers
          # Static Assets _headers file (see apps/admin/scripts/generate-headers.mjs) — required
          # for a real deploy, but this job only validates that the monorepo compiles, so a
          # placeholder is enough. Never used to serve real traffic.
          VITE_API_URL: https://example.workers.dev
