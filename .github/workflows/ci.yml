name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # apps/admin's build bakes VITE_API_URL into the bundle and the generated Workers
          # Static Assets _headers file (see apps/admin/scripts/generate-headers.mjs) — required
          # for a real deploy, but this job only validates that the monorepo compiles, so a
          # placeholder is enough. Never used to serve real traffic.
          VITE_API_URL: https://example.workers.dev
