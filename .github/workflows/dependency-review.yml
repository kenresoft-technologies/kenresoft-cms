name: Dependency Review

# Flags newly-introduced dependencies with known vulnerabilities directly on the PR, before
# they land — separate from Dependabot (which reports on already-merged/existing dependencies)
# and from CodeQL (which analyzes this repo's own code, not third-party packages).
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # required to post the review summary as a PR comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
