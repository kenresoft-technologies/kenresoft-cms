name: Dependency Review

# Flags newly-introduced dependencies with known vulnerabilities directly on the PR, before
# they land — separate from Dependabot (which reports on already-merged/existing dependencies)
# and from CodeQL (which analyzes this repo's own code, not third-party packages).
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # required to post the review summary as a PR comment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
