version: 2

updates:
  # A single pnpm workspace lockfile at the repo root covers every package under apps/*,
  # packages/*, integrations/*, and examples/* — one root entry is enough, not one per workspace.
  - package-ecosystem: 'npm'
    directory: '/'
    # Repo branch rules (CLAUDE.md): main is production, never a direct-commit/direct-PR target
    # — all work, dependency bumps included, goes through develop first. Left unset, Dependabot
    # falls back to the repo's configured default branch, which is main; every PR it opened
    # before this targeted main directly, contradicting that rule.
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      # Batches routine patch/minor bumps into one PR instead of one-per-package noise; anything
      # major stays its own PR since those need real review (see this repo's own CLAUDE.md history
      # of major-version bumps needing manual migration work, e.g. better-auth 1.7).
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Deliberately pinned to 0.9.x — @cloudflare/vitest-pool-workers 0.22.0 is a real
      # architecture change (custom Vitest "pool" -> a Vite/Vitest plugin model) that breaks
      # every one of this repo's ~40 test files' ambient `cloudflare:test` types and config API,
      # already investigated and rejected twice (CLAUDE.md's "Dependency security updates" and
      # "Dependabot alert cleanup" entries) — not a bump to make casually. Because it's a 0.x
      # package, semver treats 0.9 -> 0.22 as a "minor" bump, which would otherwise land silently
      # inside the minor-and-patch group above alongside genuinely safe updates (see the #43 PR
      # this ignore rule was added in response to). A real migration to 0.22+ needs its own
      # dedicated pass, not a routine dependency bump.
      - dependency-name: '@cloudflare/vitest-pool-workers'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
