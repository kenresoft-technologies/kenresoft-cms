packages:
  - 'apps/*'
  - 'packages/*'
  - 'integrations/*'
  - 'examples/*'

# Dependency overrides live in package.json's "pnpm.overrides": the pnpm version this repo pins
# (packageManager, 9.x) only reads them there. An "overrides:" block in this file is ignored by
# pnpm 9 without any warning, which is how the security overrides silently stopped applying
# between 2026-09-10 and 2026-09-27.
