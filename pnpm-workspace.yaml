packages:
  - 'apps/*'
  - 'packages/*'
  - 'integrations/*'
  - 'examples/*'

# Moved here from package.json's "pnpm.overrides" — that key stopped being honored by this
# pnpm version on a clean install, breaking apps/admin's typecheck (TS2742, an inferred type not
# portably nameable) via the zod overrides specifically. This is the current, unambiguous
# location pnpm itself points to when it warns "the pnpm field ... is no longer read".
overrides:
  qs: ^6.16.0
  esbuild: ^0.28.1
  # undici/sharp/ws: these three overrides apply everywhere EXCEPT one place, confirmed
  # empirically (2026-09-14) — @cloudflare/vitest-pool-workers@0.9.14's own pinned
  # wrangler@4.44.0 bundles miniflare@4.20251011.0, whose dependencies list an exact/narrow
  # undici@7.14.0 / sharp@^0.33.5 / ws@8.18.0. Neither a flat override, a `parent>child`
  # path-selector override, nor a full lockfile regeneration from scratch changed that
  # resolution — and checking the *latest* published vitest-pool-workers (0.11.1, pinning
  # wrangler@4.56.0/miniflare@4.20251217.0) confirmed via `npm view` that upstream still
  # pins the identical undici@7.14.0/sharp@^0.33.5/ws@8.18.0 trio itself, so this isn't a
  # version we're merely behind on — it's the current published state of the whole 4.x
  # miniflare line. This is the same already-documented, accepted devDependency-only risk as
  # the `wrangler` CVE below: never invoked with an affected code path by anything in this
  # repo (it only simulates the Workers runtime for local test runs), and genuinely fixing it
  # means the 0.22.x-line Vite/Vitest-plugin rewrite already investigated and rejected
  # elsewhere in this project's history as a real breaking migration, not a version bump.
  undici: ^7.29.0
  sharp: ^0.35.4
  ws: ^8.21.0
  js-yaml: ^4.3.2
  '@better-auth/core>zod': 4.4.3
  'better-call>zod': 4.4.3
  # better-auth's own direct "zod": "^4.3.6" dependency (distinct from @better-auth/core's and
  # better-call's, both already overridden above) was never covered — its own resolution to
  # 4.5.4 was the actual remaining source of apps/admin's TS2742 "inferred type not portably
  # nameable" error on auth-client.ts even after the two overrides above were in place.
  'better-auth>zod': 4.4.3
